  <meta name="google-signin-client_id" content="654296858110-fpop5lrjmod70bds48bavbhon54o55i5.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.googleSignInCallback = null;

    function initGoogleAuth(clientId) {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        setTimeout(() => initGoogleAuth(clientId), 500);
        return;
      }
      window.googleTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'email profile',
        callback: (response) => {
          if (response.access_token) {
            fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
              headers: { Authorization: 'Bearer ' + response.access_token }
            })
            .then(res => res.json())
            .then(userInfo => {
              try {
                window.localStorage.setItem('dora_user_info', JSON.stringify(userInfo));
              } catch(e){}
              if (window.googleSignInCallback) {
                window.googleSignInCallback(JSON.stringify(userInfo));
              }
            })
            .catch(err => console.error('Error fetching Google userinfo:', err));
          }
        },
      });
    }

    function getSavedGoogleAuth() {
      return window.localStorage.getItem('dora_user_info') || '';
    }

    function clearSavedGoogleAuth() {
      try {
        window.localStorage.removeItem('dora_user_info');
      } catch(e){}
    }

    function saveLocalChats(jsonStr) {
      try {
        window.localStorage.setItem('dora_saved_chats', jsonStr);
      } catch(e){}
    }

    function loadLocalChats() {
      var raw = window.localStorage.getItem('dora_saved_chats') || '';
      if (raw && (raw.includes('AI Agent Project') || raw.includes('Startup Ideas') || raw.includes('Python Web Scraper'))) {
        try {
          var parsed = JSON.parse(raw);
          if (parsed.recentChats) {
            parsed.recentChats = parsed.recentChats.filter(function(item) {
              return item !== 'AI Agent Project' && item !== 'Startup Ideas' && item !== 'Python Web Scraper';
            });
          }
          if (parsed.threads) {
            delete parsed.threads['AI Agent Project'];
            delete parsed.threads['Startup Ideas'];
            delete parsed.threads['Python Web Scraper'];
          }
          window.localStorage.setItem('dora_saved_chats', JSON.stringify(parsed));
          return JSON.stringify(parsed);
        } catch(e) {}
      }
      return raw;
    }



    function triggerGoogleAuth(callback) {
      window.googleSignInCallback = callback;
      if (window.googleTokenClient) {
        window.googleTokenClient.requestAccessToken();
      } else {
        initGoogleAuth('654296858110-fpop5lrjmod70bds48bavbhon54o55i5.apps.googleusercontent.com');
        setTimeout(() => {
          if (window.googleTokenClient) window.googleTokenClient.requestAccessToken();
        }, 800);
      }
    }

    window.addEventListener('load', function() {
      initGoogleAuth('654296858110-fpop5lrjmod70bds48bavbhon54o55i5.apps.googleusercontent.com');
    });
  </script>
